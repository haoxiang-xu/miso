name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q

  python-wheel:
    name: Pure Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify platform-independent wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel.name
          with ZipFile(wheel) as archive:
              native = []
              macho_magic = {
                  b"\xfe\xed\xfa\xce", b"\xce\xfa\xed\xfe",
                  b"\xfe\xed\xfa\xcf", b"\xcf\xfa\xed\xfe",
                  b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca",
                  b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca",
              }
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename
                  with archive.open(info) as member:
                      magic = member.read(4)
                  if (
                      name.endswith((".dll", ".dylib", ".exe", ".pyd", ".so"))
                      or Path(name).name.startswith("unchain-core")
                      or magic == b"\x7fELF"
                      or magic[:2] == b"MZ"
                      or magic in macho_magic
                  ):
                      native.append(name)
          assert not native, native
          PY
      - name: Import wheel in clean environment
        run: |
          python -m venv /tmp/unchain-wheel
          /tmp/unchain-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/unchain-wheel/bin/python -c "import importlib.metadata, unchain; assert unchain.__version__ == importlib.metadata.version('unchain')"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Compile macOS x64 release target
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --workspace --release --locked --target x86_64-apple-darwin
