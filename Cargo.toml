[workspace]
members = [
    "crates/unchain-protocol",
    "crates/unchain-daemon",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/haoxiang-xu/unchain"

[workspace.dependencies]
clap = { version = "4.6.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
