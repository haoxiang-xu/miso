[toolkit]
id = "workspace_toolkit"
name = "Workspace Toolkit"
description = "Workspace and coding toolkit for file reads, guarded writes and edits, search, LSP code intelligence, shell execution, and pinned file context."
factory = "unchain.toolkits.builtin.workspace:WorkspaceToolkit"
version = "1.0.0"
readme = "README.md"
icon = "terminal"
color = "#0f172a"
backgroundcolor = "#bae6fd"
tags = ["builtin", "workspace", "files", "search", "editing", "shell", "lsp"]

[display]
category = "builtin"
order = 10
hidden = false

[compat]
python = ">=3.9"
legacy = ">=0"

[[tools]]
name = "read"
title = "Read"
description = "Read a UTF-8 text file by absolute path with optional line slicing."
observe = false
requires_confirmation = false

[[tools]]
name = "write"
title = "Write"
description = "Create or fully overwrite a UTF-8 text file by absolute path."
observe = false
requires_confirmation = true

[[tools]]
name = "edit"
title = "Edit"
description = "Replace one unique string match, or all matches when requested, in a UTF-8 text file."
observe = false
requires_confirmation = true

[[tools]]
name = "glob"
title = "Glob"
description = "List files matching a glob pattern inside the workspace."
observe = false
requires_confirmation = false

[[tools]]
name = "grep"
title = "Grep"
description = "Search UTF-8 text files inside the workspace with regex."
observe = false
requires_confirmation = false

[[tools]]
name = "shell"
title = "Shell"
description = "Run, poll, or kill a shell task inside the workspace."
observe = false
requires_confirmation = true

[[tools]]
name = "lsp"
title = "LSP"
description = "Query a language server for definitions, references, hover text, and symbols."
observe = false
requires_confirmation = false

[[tools]]
name = "read_files"
title = "Read Files"
description = "Read one or more files from the workspace."
observe = false
requires_confirmation = false

[[tools]]
name = "read_file"
title = "Read File"
description = "Read a single file from the workspace."
observe = false
requires_confirmation = false

[[tools]]
name = "read_lines"
title = "Read Lines"
description = "Read a line range from a workspace file."
observe = false
requires_confirmation = false

[[tools]]
name = "search_text"
title = "Search Text"
description = "Search text across files in the workspace."
observe = false
requires_confirmation = false

[[tools]]
name = "list_directories"
title = "List Directories"
description = "List files and directories under a workspace path."
observe = false
requires_confirmation = false

[[tools]]
name = "file_exists"
title = "File Exists"
description = "Check whether a workspace file exists."
observe = false
requires_confirmation = false

[[tools]]
name = "write_file"
title = "Write File"
description = "Create or overwrite a workspace file."
observe = false
requires_confirmation = true

[[tools]]
name = "delete_file"
title = "Delete File"
description = "Delete a workspace file."
observe = false
requires_confirmation = true

[[tools]]
name = "move_file"
title = "Move File"
description = "Move or rename a workspace file."
observe = false
requires_confirmation = true

[[tools]]
name = "terminal_exec"
title = "Terminal Exec"
description = "Execute a shell command inside the workspace."
observe = false
requires_confirmation = true

[[tools]]
name = "pin_file_context"
title = "Pin File Context"
description = "Pin file context for the current session."
observe = false
requires_confirmation = false

[[tools]]
name = "unpin_file_context"
title = "Unpin File Context"
description = "Remove pinned file context from the current session."
observe = false
requires_confirmation = false
