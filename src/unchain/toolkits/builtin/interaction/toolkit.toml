[toolkit]
id = "interaction_toolkit"
name = "Interaction Toolkit"
description = "Focused human interaction toolkit for structured user questions."
factory = "unchain.toolkits.builtin.interaction:InteractionToolkit"
version = "1.0.0"
readme = "README.md"
icon = "message-circle-question"
color = "#0f172a"
backgroundcolor = "#fef3c7"
tags = ["builtin", "interaction", "human-input"]

[display]
category = "builtin"
order = 20
hidden = false

[compat]
python = ">=3.9"
legacy = ">=0"

[[tools]]
name = "ask_user_question"
title = "Ask User Question"
description = "Ask the user a structured selector question and suspend the run until they respond."
observe = false
requires_confirmation = false
